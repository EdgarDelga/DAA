<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navegador de Proyectos DAA</title>
  <style>
    :root {
      --bg: #0d1117;
      --text: #c9d1d9;
      --border: #30363d;
      --link: #58a6ff;
      --folder: #8b949e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .contenedor {
      width: 100%;
      max-width: 800px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background-color: #161b22;
      overflow: hidden;
    }
    .header {
      background-color: #21262d;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 15px;
      align-items: center;
    }
    button {
      background-color: #238636;
      color: white;
      border: none;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled {
      background-color: var(--border);
      cursor: not-allowed;
    }
    .lista-archivos {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background-color: #1f2428; }
    .icono { font-size: 1.2em; }
    .nombre { cursor: pointer; color: var(--text); text-decoration: none; }
    .nombre.dir { color: var(--link); font-weight: bold; }
    .nombre.dir:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <h2>Repositorio: EdgarDelga / DAA</h2>
  
  <div class="contenedor">
    <div class="header">
      <button id="btn-atras" onclick="irAtras()" disabled>⬅ Volver</button>
      <span id="ruta-actual">/ (Raíz)</span>
    </div>
    <ul id="lista-archivos" class="lista-archivos">
      <!-- Los archivos se inyectarán aquí -->
    </ul>
  </div>

  <script>
    // Configuración del repositorio
    const owner = 'EdgarDelga';
    const repo = 'DAA';
    
    // Pila para guardar el historial de navegación
    let historialRutas = ['']; 

    // Función principal para obtener datos de la API de GitHub
    async function cargarDirectorio(ruta = '') {
      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${ruta}`;
      const contenedorLista = document.getElementById('lista-archivos');
      const labelRuta = document.getElementById('ruta-actual');
      const btnAtras = document.getElementById('btn-atras');

      contenedorLista.innerHTML = '<li class="item">Cargando...</li>';
      
      try {
        const respuesta = await fetch(url);
        if (!respuesta.ok) throw new Error("Error al cargar el repositorio");
        
        const datos = await respuesta.json();
        
        // Actualizar UI
        labelRuta.textContent = ruta === '' ? '/ (Raíz)' : `/${ruta}`;
        btnAtras.disabled = historialRutas.length <= 1;
        contenedorLista.innerHTML = '';

        // Renderizar cada archivo/carpeta
        datos.forEach(item => {
          const li = document.createElement('li');
          li.className = 'item';
          
          const esCarpeta = item.type === 'dir';
          const icono = esCarpeta ? '📁' : '📄';
          
          // Si es carpeta, al hacer clic navega más profundo. Si es archivo, abre en GitHub.
          const accion = esCarpeta 
            ? `onclick="navegarA('${item.path}')"` 
            : `href="${item.html_url}" target="_blank"`;
            
          const etiqueta = esCarpeta ? 'span' : 'a';

          li.innerHTML = `
            <span class="icono">${icono}</span>
            <${etiqueta} class="nombre ${esCarpeta ? 'dir' : 'file'}" ${accion}>
              ${item.name}
            </${etiqueta}>
          `;
          
          contenedorLista.appendChild(li);
        });

      } catch (error) {
        contenedorLista.innerHTML = `<li class="item" style="color: #ff7b72;">Error: ${error.message}</li>`;
      }
    }

    // Funciones de navegación
    function navegarA(nuevaRuta) {
      historialRutas.push(nuevaRuta);
      cargarDirectorio(nuevaRuta);
    }

    function irAtras() {
      if (historialRutas.length > 1) {
        historialRutas.pop(); // Sacamos la ruta actual
        const rutaAnterior = historialRutas[historialRutas.length - 1];
        cargarDirectorio(rutaAnterior);
      }
    }

    // Iniciar la aplicación cargando la raíz
    cargarDirectorio();
  </script>
</body>
</html>
